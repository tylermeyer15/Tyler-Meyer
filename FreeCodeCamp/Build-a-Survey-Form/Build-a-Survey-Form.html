<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label id="name-label" for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required/>
      <label id="email-label" for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter your email" required/>
      <label id="number-label" for="number">Age(optional)</label>
      <input id="number" name="age" type="number" placeholder="Enter your age" min="1" max="120"/>
      <p>Which option best describes your current role?</p>
      <label for="dropdown">Current role</label>
      <select id="dropdown">
        <option value="">Select your current role</option>
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="full-time-learner">Full Time Learner</option>
        <option value="prefer-not">Prefer not to say</option>
        <option value="other">Other</option>
      </select>
      <p>Would you recommend freeCodeCamp to a friend?</p>
      <label><input type="radio" name="recommend" value="definitely">Definitely</label>
      <label><input type="radio" name="recommend" value="maybe">Maybe</label>
      <label><input type="radio" name="recommend" value="not-sure">Not Sure</label>
      <p>What would you like to see improved? (Check all that apply)</p>
      <label><input type="checkbox" value="front-end">Front-end Projects</label>
      <label><input type="checkbox" value="back-end">Back-end Projects</label>
      <label><input type="checkbox" value="challenges">Challenges</label>
      <label><input type="checkbox" value="additional-courses">Additional Courses</label>
      <p>Any comments or suggestions</p>
      <textarea name="comments" placeholder="Enter your comment here..."></textarea>
      <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>
