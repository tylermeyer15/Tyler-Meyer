<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task-1">
                <label for="task-1">Explore gaming keyboards</label>

                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://example.com/keyboards" target="_blank">
                        Store Link
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-2">
                <label for="task-2">Finish the report</label>

                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://example.com/report" target="_blank">View Report</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task-3">
                <label for="task-3">Check phone warranty</label>

                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://example.com/warranty" target="_blank">View Warranty</a>
                    </li>
                </ul>    
            </li>
            <li>
                <input type="checkbox" id="task-4">
                <label for="task-4">Look up processor specs</label>

                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://example.com/specs" target="_blank">Specs Link</a>
                    </li>
                </ul>
            </li>
        </ul>
</body>

</html>
